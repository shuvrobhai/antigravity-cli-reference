[project]
name = "antigravity-cli-reference"
version = "0.1.0"
description = "Source-classified Google Antigravity CLI reference with a machine-readable knowledge file and consistency checks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# CLI scripts intentionally catch broad exceptions to report errors gracefully.
ignore = ["BLE001"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.2",
]
