name: Consistency Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Lint with ruff
        run: |
          uv run ruff check research/scripts/
          uv run ruff format --check research/scripts/

      - name: Run consistency checker
        run: |
          uv run python research/scripts/check_consistency.py

      - name: Run path-layout tests
        run: |
          uv run pytest research/tests/
